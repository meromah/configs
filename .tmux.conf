# Change prefix to Ctrl–a
unbind C-b
set-option -g prefix M-d

# Make sure tmux knows the new prefix key table
bind-key M-d send-prefix

# Recommended: also bind split and other keys under the new table
bind-key -T prefix \\ split-window -h
bind-key -T prefix - split-window -v


# custom configuration to run upon session creation
set -g status-bg cyan
set -g window-status-style bg=pink
set -g window-status-current-style fg=orange,bg=black
set-option -g default-shell /bin/bash

set -g mouse on
set-option -g set-clipboard on
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -sel clip -i"

setw -g mode-keys vi

# escape doesn't seem to be working, this fixed it
set -s escape-time 0
